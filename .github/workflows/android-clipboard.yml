# Android 版クリップ棚（android-clipboard/）を、GitHub の環境でテスト・ビルドする。
# main に入ると、APK を、リリース「clipshelf-android-latest」に置く（ダウンロードして入れる）。
name: android-clipboard

on:
  push:
    paths:
      - 'android-clipboard/**'
      - '.github/workflows/android-clipboard.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-clipboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 署名の鍵（GitHub の Secrets にあれば使う。なければ debug 用の鍵）
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: テスト（Java 部分: 暗号・ペアリングコード）
        working-directory: android-clipboard/tests
        run: |
          mkdir -p /tmp/core-out
          javac -encoding UTF-8 -d /tmp/core-out ../app/src/main/java/io/github/skmax3/clipshelf/core/*.java CoreTest.java
          java -Dfile.encoding=UTF-8 -Dstdout.encoding=UTF-8 -cp /tmp/core-out CoreTest

      - name: 署名の鍵を用意（Secrets にあるとき）
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: ビルド（APK）
        working-directory: android-clipboard
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mkdir -p ../out
          cp app/build/outputs/apk/release/app-release.apk ../out/ClipShelfAndroid.apk
          ls -la ../out

      - uses: actions/upload-artifact@v4
        with:
          name: ClipShelfAndroid
          path: out/ClipShelfAndroid.apk

      - name: 最新版として公開（main のみ）
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete clipshelf-android-latest --yes --cleanup-tag || true
          gh release create clipshelf-android-latest out/ClipShelfAndroid.apk --target "${{ github.sha }}" --title "クリップ棚（Android）最新版" --notes "main の最新のビルドです。APK をダウンロードして入れます。使い方は android-clipboard/README.md を参照。"
