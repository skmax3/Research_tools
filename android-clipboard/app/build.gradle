plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.skmax3.clipshelf'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.skmax3.clipshelf'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }

    // 署名の鍵: GitHub の Secrets に鍵があれば、それで署名する（更新するとき、入れ直さなくてよい）。
    // なければ、ビルドのたびに作られる debug 用の鍵で署名する（入れられるが、更新には入れ直しが必要）
    signingConfigs {
        release {
            def file = System.getenv('KEYSTORE_FILE')
            if (file) {
                storeFile new File(file)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('KEYSTORE_FILE') ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
