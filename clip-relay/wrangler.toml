# クリップ棚の中継サーバー（Cloudflare Workers + Durable Objects、無料プラン）
# main に入ると GitHub Actions（.github/workflows/clip-relay.yml）が自動で配置する。
name = "fwr-clip"
main = "src/index.js"
compatibility_date = "2025-10-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
