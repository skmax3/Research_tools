<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>研究ツール集</title>
<style>
:root{--bg:#f4f5f8;--card:#fff;--ink:#1c1c1e;--muted:#6e6e73;--line:#dcdde3;--accent:#0a84ff}
@media (prefers-color-scheme:dark){:root{--bg:#16181d;--card:#1f2228;--ink:#f2f2f7;--muted:#9a9aa2;--line:#33363d}}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  padding:max(24px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 32px max(16px,env(safe-area-inset-left))}
main{max-width:720px;margin:0 auto}
h1{font-size:22px;margin:0 0 4px}
p.lead{color:var(--muted);margin:0 0 20px}
ul{list-style:none;padding:0;margin:0;display:grid;gap:10px}
a.tool{display:flex;gap:14px;align-items:center;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;color:inherit;text-decoration:none}
a.tool:hover,a.tool:focus-visible{border-color:var(--accent)}
a.tool img{width:52px;height:52px;border-radius:12px;flex:none}
a.tool b{display:block;font-size:16px}
a.tool span{color:var(--muted);font-size:13px}
</style>
</head>
<body>
<main>
  <h1>研究ツール集</h1>
  <p class="lead">FWR（羽ばたきロータ機）研究で使う小さなツール。各ツールはブラウザだけで動き、データは端末の外に送信しません。</p>
  <ul>
    <!-- ツールを追加したらここに1項目追加する -->
    <li><a class="tool" href="clip-box/"><img src="clip-box/icon-192.png" alt=""><div><b>クリップ帳</b><span>テキストや画像を貯めてタップでコピー。iPhone と Mac はファイルの受け渡しで同期</span></div></a></li>
    <li><a class="tool" href="photo-memo/"><img src="photo-memo/icon-192.png" alt=""><div><b>写真寸法メモ</b><span>写真に矢印・寸法線・コメントを書き込んで、チャットに貼れる画像にする</span></div></a></li>
  </ul>
</main>
</body>
</html>
